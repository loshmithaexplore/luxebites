{% extends 'base.html' %}

{% block title %}
Login | Luxe Bites
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h2>Welcome Back!</h2>

        <p class="auth-subtitle">
            Login to continue your delicious journey.
        </p>

        {% if form.errors %}

            <div class="alert error-alert">
                Username or password is incorrect.
            </div>

        {% endif %}

        <form method="post" class="auth-form">

            {% csrf_token %}

            <div class="form-group">

                <label for="id_username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="id_password">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button type="submit" class="primary-btn full-btn">
                Login
            </button>

        </form>

        <p class="auth-bottom">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </p>

    </div>

</section>

{% endblock %}
